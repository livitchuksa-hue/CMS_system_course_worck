<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Главная</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page" data-page-id="3">
    <section id="el-3" class="el comments-viewer" style="left:538px;top:212.98000000000002px;width:360px;height:240px;" data-comments-viewer="3" data-comments-source="4">
      <h3 class="comments-title">Комментарии</h3>
      <div class="comments-list">
        <p class="comments-empty">Комментариев пока нет.</p>
      </div>
    </section>

    <section id="el-4" class="el comments-block" style="left:132px;top:183.98000000000002px;width:360px;height:220px;" data-comments-block="4" data-max="100">
      <h3 class="comments-title">Комментарии</h3>
      <div class="comments-list" id="comments-list-4">
      </div>
      <div class="comments-form">
        <input type="text" class="comment-author" placeholder="Ваше имя" />
        <textarea class="comment-text" placeholder="Комментарий..."></textarea>
        <button type="button" class="btn-primary comment-submit" data-block="4">Отправить</button>
      </div>
    </section>

  </div>
  <script src="script.js"></script>
</body>
</html>
